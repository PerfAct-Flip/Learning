<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
</head>
<body>
    <script>
        // const prompt = require("prompt-sync")({ sigint: true });


let num = Math.floor(Math.random() * 100) + 1;
num = Number.parseInt(num);
// console.log("random num is:", num);
let count = 0; // intial value of tries 
let guess; //to store input from user
console.log("guess a number!!, if it matches your input you win");

guess = prompt("Guess the number");
//taking input from user.
do {
  guess = Number.parseInt(guess);

  if (guess > num) {
    console.log("\nentered number is greater");
    // console.log("type of guess", typeof guess);
    guess = prompt("enter number!!");
    guess = Number.parseInt(guess);
    ++count;
    continue;
  }
  else if (guess < num) {
    console.log("entered number is smaller");
    guess = prompt("enter number!!");
    guess = Number.parseInt(guess);
    ++count;
    continue;
  }
  else {
    break;
  }
} while (guess != num);
//break the loop when the entered number is equal to the generated value.

// final score on the beases of attempt by user.
console.log("congrats you guessed right!!")
console.log(`your score is ${100 - count}`);

    </script>
