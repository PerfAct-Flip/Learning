<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Autofixing</title>
    <style>
        .grid{
            display: grid;
            grid-gap: 1rem;
            /* grid-template-columns: repeat(3, 1fr); */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            /* justify-content: center; */
        }
        .box{
            background-color: rgb(95, 74, 189);
            color: rgb(203, 198, 252);
            border: 3px solid black;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="box">This is item box - 1</div>
        <div class="box">This is item box - 2</div>
        <div class="box">This is item box - 3</div>
        <div class="box">This is item box - 4</div>
        <div class="box">This is item box - 5</div>
        <div class="box">This is item box - 6</div>
        <div class="box">This is item box - 7</div>
        <div class="box">This is item box - 8</div>
        <div class="box">This is item box - 9</div>
        <div class="box">This is item box - 10</div>
        <div class="box">This is item box - 11</div>
        <div class="box">This is item box - 12</div>
    </div>
</body>
</html>
