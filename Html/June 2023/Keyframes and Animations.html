<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and Animations</title>
    <style>
        body{
            background-color: rgb(27, 20, 20);
            margin: 0px;
            padding: 0px;
        }
        .container{
            /* display: flex; */
            background-color: rgb(0, 0, 255);
            width: 600px;
            height: 600px;
            padding: 0px;
            margin: 0px;
        }
        .box{
            background-color: rgba(137, 43, 226, 0.582);
            border: 1px solid whitesmoke;
            width: 300px;
            height: 300px;
            position: relative;
            /* animation part */
            animation-name: trial-2 ;
            animation-duration: 3s;
            animation-iteration-count: 4;
            animation-fill-mode:forwards;
            /* animation-timing-function: ease-in-out;
            animation-direction: reverse; */
            /* shorthand for animation */
            /* animation: animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-fill-mode; */

        }
        @keyframes trial-2{
            0%{
                top: 0px;
                left: 0px;
            }
            25%{
                top: 300px;
                left: 0px;
            }
            50%{
                top: 300px ;
                left: 300px ;
            }
            75%{
                top: 0px ;
                left: 300px ;
            }
            100%{
                top: 0px;
                left: 0px ;
            }
        }
        @keyframes trial-1{
            from{
                width: 30%;
            }
            to{
                width: 100%;
            }
    }
    </style>
</head>
<body>
    <div class="card"></div>
    <div class="container">
        <div class="box">
            This is a box.
        </div>
    </div>
</body>
</html>
