<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility and Z- index</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border: 2px solid black;
        }
        #box1{background-color: green;
              z-index: 1;
            position: relative;}
        #box2{background-color: rgb(128, 47, 0);
              z-index: 2;
            position: relative;}
        #box3{background-color: rgb(0, 98, 128);
        z-index: 3;
        position: relative;}
        #box4{background-color: rgb(66, 0, 128);
        z-index: 4;
        position: relative;
    bottom: 30px;}
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
